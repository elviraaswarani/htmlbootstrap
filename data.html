<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Data Siswa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-info-subtle py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                
                <div class="card bg-white shadow-lg p-4 rounded-4 border-0">
                    <div class="card-body">
                        
                        <div class="text-center mb-4">
                            <div class="d-inline-block bg-primary text-white px-4 py-2 rounded-3 shadow-sm">
                                <h2 class="fw-bold mb-0 fs-4">📊 Daftar Nilai Siswa</h2>
                            </div>
                        </div>

                        <div class="table-responsive">
                            <table class="table table-hover table-bordered bg-white text-center align-middle mb-0 shadow-sm rounded-3 overflow-hidden">
                                <thead class="table-dark">
                                    <tr>
                                        <th rowspan="2" class="align-middle">Nama</th>
                                        <th colspan="3" class="align-middle">Nilai</th>
                                    </tr>
                                    <tr>
                                        <th>Kimia</th>
                                        <th>Fisika</th>
                                        <th>Biologi</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td class="fw-bold text-secondary">Robby</td>
                                        <td><span class="badge bg-warning text-dark">76</span></td>
                                        <td><span class="badge bg-success">80</span></td>
                                        <td><span class="badge bg-success">81</span></td>
                                    </tr>
                                    <tr>
                                        <td class="fw-bold text-secondary">Rendi</td>
                                        <td><span class="badge bg-success">84</span></td>
                                        <td><span class="badge bg-danger">70</span></td>
                                        <td><span class="badge bg-warning text-dark">75</span></td>
                                    </tr>
                                    <tr>
                                        <td class="fw-bold text-secondary">Alfian</td>
                                        <td><span class="badge bg-success">96</span></td>
                                        <td><span class="badge bg-danger">70</span></td>
                                        <td><span class="badge bg-danger">71</span></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a href="index.html" class="btn btn-outline-secondary btn-sm rounded-pill px-3">← Beranda</a>
                            <a href="form.html" class="btn btn-outline-primary btn-sm rounded-pill px-3">Ke Form →</a>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
