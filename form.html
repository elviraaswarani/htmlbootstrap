<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-info-subtle py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                
                <div class="card bg-white shadow-lg rounded-4 overflow-hidden border-0">
                    <div class="row g-0">
                        
                        <div class="col-md-5 d-none d-md-flex flex-column justify-content-center align-items-center bg-light p-5 text-center border-end">
                            <div class="display-2 mb-3">👥💬</div>
                            <span class="badge bg-primary px-3 py-2 rounded-2 mb-2">Sosial Media</span>
                            <p class="text-muted small">Bergabunglah dengan ribuan calon developer berbakat.</p>
                        </div>
                        
                        <div class="col-md-7 p-5">
                            <div class="d-inline-block bg-primary text-white px-3 py-2 rounded-3 shadow-sm mb-3">
                                <h2 class="fw-bold mb-0 fs-4">Buat Account Baru ✨</h2>
                            </div>
                            <p class="text-muted small mb-4">Isi formulir pendaftaran di bawah ini</p>

                            <form action="welcome.html">
                                <div class="row">
                                    <div class="col-sm-6 mb-3">
                                        <label class="form-label small fw-bold">First name</label>
                                        <input type="text" name="first_name" class="form-control rounded-3" required>
                                    </div>
                                    <div class="col-sm-6 mb-3">
                                        <label class="form-label small fw-bold">Last name</label>
                                        <input type="text" name="last_name" class="form-control rounded-3">
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label small fw-bold d-block">Gender</label>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="gender" id="male" value="male">
                                        <label class="form-check-label" for="male">Male</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="gender" id="female" value="female">
                                        <label class="form-check-label" for="female">Female</label>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label small fw-bold">Nationality</label>
                                    <select name="nationality" class="form-select rounded-3">
                                        <option value="indonesia">Indonesia</option>
                                        <option value="english">English</option>
                                        <option value="other">Other</option>
                                    </select>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label small fw-bold d-block">Language Spoken</label>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="checkbox" id="indo" value="bahasa">
                                        <label class="form-check-label small" for="indo">Bahasa Indonesia</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="checkbox" id="eng" value="english">
                                        <label class="form-check-label small" for="eng">English</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="checkbox" id="other_lang" value="other">
                                        <label class="form-check-label small" for="other_lang">Other</label>
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label small fw-bold">Bio</label>
                                    <textarea name="bio" class="form-control rounded-3" rows="3"></textarea>
                                </div>

                                <div class="d-grid gap-2">
                                    <button type="submit" class="btn btn-success btn-lg py-2 rounded-pill fw-bold shadow-sm">Sign Up</button>
                                    <a href="index.html" class="btn btn-link btn-sm text-secondary text-decoration-none mt-2">← Kembali ke Beranda</a>
                                </div>
                            </form>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
